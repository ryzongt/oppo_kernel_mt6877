name: Build Kernel 4.19

on:
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: k6877v1_64_k419_defconfig

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 1

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libncurses6 libtinfo6

    - name: Clone Clang via Sparse Checkout (Fast)
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchains
        cd $GITHUB_WORKSPACE/toolchains
        
        git clone --branch android14-release --single-branch --depth 1 --no-checkout https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 google-clang
        cd google-clang
        
        git sparse-checkout set clang-r487747c
        git checkout
        
        mv clang-r487747c ../clang
        cd ..
        rm -rf google-clang

    - name: Build Kernel
      run: |
        CLANG_BIN="$GITHUB_WORKSPACE/toolchains/clang/bin"
        export PATH="$CLANG_BIN:$PATH"
        
        make O=out ARCH=arm64 $DEFCONFIG
        
        make -j$(nproc --all) O=out \
                      ARCH=arm64 \
                      CC=clang \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      LLVM=1 \
                      LLVM_IAS=1

    - name: Check Artifact
      run: |
        if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Success! Image.gz found."
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
        else
            echo "Error: out/arch/arm64/boot/Image.gz not found!"
            exit 1
        fi

    - name: Upload Image.gz
      if: env.BUILD_SUCCESS == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Image-k6877v1_64
        path: out/arch/arm64/boot/Image.gz

        
